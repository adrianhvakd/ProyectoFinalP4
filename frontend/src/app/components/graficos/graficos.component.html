<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div class="bg-base-200 p-4 rounded-lg">
    <h3 class="font-bold text-lg mb-2">Nivel de Agua (%)</h3>
    <canvas
      baseChart
      [data]="nivelChartData()"
      [options]="chartOptions"
      type="line">
    </canvas>
  </div>

  <div class="bg-base-200 p-4 rounded-lg">
    <h3 class="font-bold text-lg mb-2">pH</h3>
    <canvas
      baseChart
      [data]="phChartData()"
      [options]="chartOptions"
      type="line">
    </canvas>
  </div>
</div>

@if (loading()) {
  <div class="flex justify-center p-4">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>
}

<div class="mt-4 text-sm text-base-content/70">
  <p>Última actualización: {{ ultimaActualizacion() | date:'medium' }}</p>
  <p class="text-xs">Datos en tiempo real via WebSocket</p>
</div>
